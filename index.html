<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Обновить</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .fake-refresh {
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5f6368;
      transition: background 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .fake-refresh:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    .fake-refresh:active {
      background: rgba(0, 0, 0, 0.12);
    }

    .fake-refresh svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    /* Вращение вокруг центра иконки, как при реальном обновлении */
    .fake-refresh.spinning svg {
      animation: spin 0.8s linear infinite;
      transform-origin: 50% 50%;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <button class="fake-refresh" id="fakeRefresh" title="Обновить" aria-label="Обновить">
    <!-- Иконка как в Chrome / Material Design -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
      <polyline points="21 3 21 9 15 9"/>
    </svg>
  </button>

  <audio id="secretAudio" src="sound.mp3" preload="auto"></audio>

  <script>
    const btn = document.getElementById('fakeRefresh');
    const audio = document.getElementById('secretAudio');

    btn.addEventListener('click', () => {
      btn.classList.add('spinning');
      audio.loop = true;
      audio.play().catch(err => console.error('Ошибка звука:', err));
    });
  </script>

</body>
</html>
